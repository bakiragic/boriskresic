<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulatori · Boris Krešić</title>
<meta name="description" content="Kalkulatori bračne stečevine i nasljednih dijelova prema propisima FBiH.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F2; --surface:#FFFFFF; --ink:#1C2B36; --muted:#56636C; --line:#D3D9D6;
  --deep:#1E3348; --deep-ink:#FFFFFF; --brass:#8A672B; --brass-soft:#F1E8D6;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11181E; --surface:#18222A; --ink:#E4E8E6; --muted:#9BA7AE; --line:#2B3842;
    --deep:#A9C3DD; --deep-ink:#10202E; --brass:#CFA95F; --brass-soft:#2C2618;
  }
}
:root[data-theme="dark"]{
  --paper:#11181E; --surface:#18222A; --ink:#E4E8E6; --muted:#9BA7AE; --line:#2B3842;
  --deep:#A9C3DD; --deep-ink:#10202E; --brass:#CFA95F; --brass-soft:#2C2618;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.narrow > *{max-width:760px}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{text-decoration:none;font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.1}
.brand span{display:block;font-family:var(--sans);font-size:.74rem;font-weight:500;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:4px;font-family:var(--sans);font-size:.9rem}
.nav a{text-decoration:none;padding:8px 12px;border-radius:4px}
.nav a:hover{background:var(--brass-soft)}
.credit-pill{margin-left:10px;padding:5px 11px;border:1px solid var(--brass);color:var(--brass);border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.menu-btn{display:none;font:600 .9rem var(--sans);background:none;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:4px}
@media (max-width:820px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 20px 16px}
  .nav.open{display:flex}
  .nav a{padding:12px 4px;border-bottom:1px solid var(--line);border-radius:0}
  .credit-pill{margin:12px 0 0;align-self:flex-start}
}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:72px 0 64px}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.08;font-weight:500;letter-spacing:-.015em;margin:0 0 24px;max-width:17ch}
.lead{font-size:1.2rem;color:var(--muted);max-width:56ch;margin:0 0 32px;line-height:1.65}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-fig{margin:0}
.hero-fig figcaption{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:8px}
.kin{width:100%;height:auto;display:block}
.kin-lines path{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s .2s ease-out forwards}
.kin-lines path.dashed{stroke-dasharray:4 4;stroke-dashoffset:0;animation:fade .6s 1.4s both}
.kin-nodes rect{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.kin-nodes text{font-family:var(--sans);font-size:11.5px;fill:var(--ink);text-anchor:middle}
.kin-nodes rect.focus{fill:var(--deep);stroke:var(--deep)}
.kin-nodes text.focus-t{fill:var(--deep-ink);font-weight:600;font-size:13px}
.kin-orders text{font-family:var(--serif);font-style:italic;font-size:13px;fill:var(--brass)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.kin-lines path{animation:none;stroke-dashoffset:0}.kin-lines path.dashed{animation:none}}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:36px;padding:44px 0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 .95rem var(--sans);padding:12px 20px;border-radius:4px;border:1px solid var(--deep);cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary{background:var(--deep);color:var(--deep-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.link-btn{background:none;border:none;padding:0;margin-top:6px;font:500 .8rem var(--sans);color:var(--muted);text-decoration:underline;cursor:pointer}

/* sections */
.block{padding:72px 0;border-top:1px solid var(--line)}
.block h1,.block h2{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:500;margin:0 0 12px;letter-spacing:-.01em}
.section-lead{color:var(--muted);max-width:62ch;margin:0 0 32px}
.note{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin:0 0 28px}
.empty{font-style:italic;color:var(--muted);padding:24px 0}

/* cv */
.cv-head{display:flex;gap:24px;align-items:center;margin-bottom:28px}
.cv-head img{width:112px;height:112px;object-fit:cover;border-radius:4px;flex:none;filter:grayscale(.15)}
.cv-head h2{margin:0 0 6px}
.cv-sub{margin:0;font-family:var(--sans);font-size:.9rem;color:var(--muted)}
.cv-sub a{color:var(--ink);text-underline-offset:3px}
.cv-group{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:28px 0;border-top:1px solid var(--line)}
.cv-group h3{font-size:1.15rem;font-weight:600;margin:2px 0 0;line-height:1.3}
.cv-intro{margin:0 0 14px;color:var(--muted);font-size:1rem;max-width:70ch}
.cv-row{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:6px 0 12px}
.cv-when{font-family:var(--sans);font-size:.84rem;color:var(--brass);font-weight:600;padding-top:3px;font-variant-numeric:tabular-nums}
.cv-what strong{display:block;font-weight:600;line-height:1.4}
.cv-what span{display:block;color:var(--muted);font-size:1rem}
.cv-what small{display:block;font-family:var(--sans);font-size:.78rem;color:var(--muted);margin-top:2px}
.cv-list{margin:0;padding-left:1.1em;max-width:72ch}
.cv-list li{margin-bottom:8px;padding-left:4px}
.cv-more{margin-top:10px}
.cv-more summary{cursor:pointer;font:600 .92rem var(--sans);padding:10px 0;color:var(--ink)}
.cefr{border-collapse:collapse;font-family:var(--sans);font-size:.88rem}
.cefr th{font-weight:500;text-align:left;padding:3px 24px 3px 0;color:var(--muted)}
.cefr td{font-weight:700}
@media (max-width:760px){.cv-group{grid-template-columns:1fr;gap:10px}.cv-row{grid-template-columns:1fr;gap:0}.cv-head img{width:84px;height:84px}}

/* radovi */
.pub-tools{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.search{flex:1 1 320px;display:flex;flex-direction:column;gap:6px;font:600 .85rem var(--sans)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:500 .88rem var(--sans);background:transparent;color:var(--ink);border:none;padding:11px 16px;cursor:pointer;min-height:44px}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.chip{font:500 .85rem var(--sans);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pub-h{font-size:1.35rem;font-weight:500;margin:36px 0 4px;display:flex;align-items:baseline;gap:10px}
.pub-h span{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:500}
.pubs{list-style:none;margin:0;padding:0}
.pubs li{display:grid;grid-template-columns:72px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--line)}
.pub-year{font-family:var(--sans);font-weight:600;color:var(--brass);padding-top:3px;font-variant-numeric:tabular-nums}
.pubs h4{font-size:1.15rem;font-weight:500;margin:0 0 4px;line-height:1.38;max-width:72ch}
.pubs h4 a{text-underline-offset:3px;text-decoration-color:var(--line)}
.pub-auth{margin:0;font-size:1rem}
.pub-meta{font-family:var(--sans);font-size:.83rem;color:var(--muted);margin:2px 0 0;max-width:80ch}
@media (max-width:560px){.pubs li{grid-template-columns:1fr;gap:2px}}
.admin{margin-top:36px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 20px}
.admin summary{cursor:pointer;font:600 .95rem var(--sans);padding:16px 0}
.admin[open]{padding-bottom:20px}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font:600 .85rem var(--sans)}
.form-grid .full{grid-column:1/-1}
input,select,textarea{font:400 1rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox],input[type=radio]{width:auto;padding:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass)}
.form-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:20px 0 16px;font-family:var(--sans);font-size:.9rem}
.err{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#F2B8B5}}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}

/* kalkulatori */
.calc-list{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.calc{padding:28px 32px 32px 0}
.calc + .calc{padding:28px 0 32px 32px;border-left:1px solid var(--line)}
.calc h3{font-size:1.6rem;font-weight:500;margin:0}
.calc-law{font-family:var(--sans);font-size:.85rem;color:var(--brass);font-weight:600;margin:4px 0 16px}
.calc p:not(.calc-law){max-width:52ch;margin:0 0 24px}
@media (max-width:760px){.calc-list{grid-template-columns:1fr}.calc,.calc + .calc{padding:24px 0;border-left:none}.calc + .calc{border-top:1px solid var(--line)}}
.disclaimer{font-family:var(--sans);font-size:.85rem;color:var(--muted);border-left:3px solid var(--brass);padding:4px 0 4px 14px;margin:28px 0 0;max-width:72ch}
.disclaimer.compact{margin:12px 0;font-size:.78rem}

.calc-view{padding-bottom:40px}
.calc-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0 4px;font-family:var(--sans)}
.calc-bar strong{display:block;font-size:1rem;text-align:right}
.calc-bar span{font-size:.8rem;color:var(--muted)}
.calc-stage{width:min(1120px,100% - 24px);margin:8px auto 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#f2f5f9;color:#1c2b3a;color-scheme:light}
.calc-stage input,.calc-stage select,.calc-stage textarea{width:auto;font:inherit;color:inherit;background:revert;border:revert;border-radius:revert;padding:revert}
.calc-stage input:focus,.calc-stage select:focus,.calc-stage textarea:focus{outline:2px solid #2e6da4}
.calc-stage > div{min-height:auto !important}
.calc-stage table{display:block;overflow-x:auto}
@media (max-width:560px){.calc-bar strong{text-align:left}}

/* dialog */
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:20px;z-index:50}
.dialog{background:var(--surface);color:var(--ink);border-radius:6px;max-width:440px;width:100%;padding:28px;max-height:calc(100% - 40px);overflow:auto}
.dialog h2{margin:0;font-size:1.5rem;font-weight:500}
.price{font-size:2.6rem;font-weight:500;margin:4px 0 8px;line-height:1.1}
.dialog p{font-size:1rem}
.check{display:flex;gap:10px;align-items:flex-start;font:500 .9rem var(--sans);margin:16px 0}
.check input{width:18px;height:18px;margin-top:2px;flex:none}
.demo-box{font-family:var(--sans);font-size:.8rem;background:var(--brass-soft);padding:10px 12px;border-radius:4px;color:var(--ink)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}

/* footer */
.site-footer{border-top:1px solid var(--ink);padding:28px 0 40px;font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.foot-row{display:grid;grid-template-columns:auto auto 1fr;gap:12px 40px;align-items:start}
.foot-row p{margin:0}
.foot-row .disclaimer{margin:0}
@media (max-width:760px){.foot-row{grid-template-columns:1fr}}

@media print{.site-header,.site-footer,.calc-bar,.disclaimer.compact{display:none}.calc-stage{border:none;width:100%}}

.nav a[aria-current="page"]{background:var(--brass-soft);font-weight:600}
.page .block{border-top:none;padding-top:56px}
.page{min-height:60vh}
.putokaz{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-bottom:72px}
.putokaz a{text-decoration:none;padding:22px 24px 26px 0;display:flex;flex-direction:column;gap:6px}
.putokaz a + a{padding-left:24px;border-left:1px solid var(--line)}
.putokaz strong{font-size:1.25rem;font-weight:500}
.putokaz span{font-family:var(--sans);font-size:.86rem;color:var(--muted);line-height:1.5}
.putokaz a:hover strong{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--brass)}
@media (max-width:900px){.putokaz{grid-template-columns:1fr 1fr}.putokaz a:nth-child(3){padding-left:0;border-left:none}.putokaz a:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:560px){.putokaz{grid-template-columns:1fr}.putokaz a,.putokaz a + a{padding:18px 0;border-left:none}.putokaz a + a{border-top:1px solid var(--line)}}

</style>
</head>

<div id="root"></div>
